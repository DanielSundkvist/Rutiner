<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutiner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutiner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF4FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: en skärm i taget på telefon. Regnbågen överst visar hur långt vi kommit,
   ett stort kort visar det enda steg som gäller just nu. En värld, ett ljust tema. */
:root{
  color-scheme: light;
  --sky:#EEF4FF; --sky-2:#FBEFFA;
  --ink:#3A2A5E; --ink-soft:#75689A;
  --card:#FFFFFF; --line:#E1D9F5;
  --accent:#D9408A; --accent-deep:#A82B67; --accent-ink:#FFFFFF;
  --sun:#FFC53D; --mint:#2FB89A;
  --r1:#F4627D; --r2:#FFA347; --r3:#FFD84D; --r4:#5CCB8B; --r5:#5AA9F0; --r6:#A07BEA;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body.t-dino{--sky:#EAF6E4;--sky-2:#FFF6DC;--accent:#2F8F4E;--accent-deep:#1F6B38;--line:#D3E4CA;--ink:#243B2A;--ink-soft:#5F7A66}
.t-dino .ring .left{stroke:url(#rd)}
body.night{color-scheme:dark;--sky:#171A45;--sky-2:#2A2360;--ink:#F1ECFF;--ink-soft:#B9B2DA;--card:#2C2D68;--line:#4B4B8E;--accent:#7C6BE0;--accent-deep:#5445B4}
.night .step{box-shadow:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky),var(--sky-2));background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--r5);outline-offset:3px}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:16px}

/* Vem är jag */
.who{display:flex;gap:10px;margin-bottom:10px}
.who button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--line);background:var(--card);
  border-radius:999px;padding:4px 10px;font-family:var(--display);font-weight:800;font-size:20px;min-height:54px;opacity:.55}
.who button[aria-pressed=true]{border-color:var(--accent);opacity:1}
.who .f{font-size:32px;line-height:1}
.who button{min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who[hidden]{display:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{flex:1;display:flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700}

/* Regnbågen */
.sky{position:relative;width:100%;aspect-ratio:320/160}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.pal,.goal{position:absolute;transform:translate(-50%,-50%);font-size:44px;line-height:1}
.pal{transition:left .9s ease,top .9s ease;z-index:2}
.pal span{display:inline-block;transform:scaleX(-1)}
.goal{font-size:34px}
.stars{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:3px;flex-wrap:wrap;padding:0 48px}
.stars i{font-style:normal;font-size:17px;filter:grayscale(1);opacity:.28}
.stars i.on{filter:none;opacity:1;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.5)}100%{transform:scale(1)}}

.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;text-align:center}

/* Stegkortet */
.step{background:var(--card);border-radius:28px;padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(88,60,150,.13)}
.ring{position:relative;width:min(56vw,210px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:10}
.ring .left{fill:none;stroke:url(#rb);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .pic{position:absolute;inset:0;display:grid;place-items:center;font-size:min(26vw,96px);line-height:1}
.step h2{font-size:34px;text-align:center}
.time{color:var(--ink-soft);font-weight:700;font-size:16px;min-height:1.35em}
.big{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;
  font-size:28px;padding:12px 20px;width:100%;min-height:68px;box-shadow:0 6px 0 var(--accent-deep)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-deep)}
.big.calm{background:var(--mint);box-shadow:0 6px 0 #1F8A72}
.big.calm:active{box-shadow:0 2px 0 #1F8A72}

/* Bildremsan */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.tile{flex:0 0 62px;height:62px;border-radius:16px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:30px;position:relative}
.tile.done{opacity:.55}
.tile.done::after{content:"⭐";position:absolute;right:-6px;top:-8px;font-size:20px}
.tile.now{border-color:var(--accent);border-width:4px;transform:scale(1.06)}

/* Min dag */
.day{display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 16px}
.part .ic{font-size:44px;line-height:1;flex:0 0 52px;text-align:center}
.part h3{font-size:24px}
.part p{margin:2px 0 0;color:var(--ink-soft);font-weight:700;font-size:16px}
.part.done{opacity:.6}
.part.hug{background:#FFF1C9;border-color:var(--sun)}
.part.hug h3{font-size:28px}
.part.home{background:#E6F8F1;border-color:var(--mint)}
.arrow{text-align:center;color:var(--ink-soft);font-size:20px;line-height:1}

/* För vuxna */
.adult{font-size:16px}
.adult h2{font-size:26px}
.adult h3{font-size:20px;margin-top:8px}
.adult p{margin:4px 0;color:var(--ink-soft)}
.row{display:grid;grid-template-columns:52px 1fr 58px;gap:6px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px}
.row.nomin{grid-template-columns:52px 1fr}
.row .acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px;width:100%;min-width:0}
input.em{text-align:center;font-size:22px;padding:6px 2px}
.sm{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700;min-height:40px}
.sm.warn{border-color:var(--r1);color:#B3243F}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.gate{display:flex;gap:10px;justify-content:center}
.gate button{flex:1;font-family:var(--display);font-size:28px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:14px 0}
label.chk{display:flex;gap:10px;align-items:center;font-weight:700}
label.chk input{width:24px;height:24px}

nav{position:sticky;bottom:0;display:flex;gap:8px;padding:10px 0 12px;background:linear-gradient(180deg,transparent,var(--sky-2) 35%)}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--ink);font-weight:800;font-size:16px;white-space:nowrap;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 2px}
nav a[aria-current=page]{border-color:var(--accent);color:var(--accent)}
nav a.grown{flex:0 0 auto;padding:10px 14px;color:var(--ink-soft);font-weight:700;font-size:15px;display:grid;place-items:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4627D"/><stop offset=".25" stop-color="#FFA347"/><stop offset=".5" stop-color="#FFD84D"/>
    <stop offset=".7" stop-color="#5CCB8B"/><stop offset=".85" stop-color="#5AA9F0"/><stop offset="1" stop-color="#A07BEA"/>
  </linearGradient>
  <linearGradient id="rd" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#2F8F4E"/><stop offset=".55" stop-color="#F2C230"/><stop offset="1" stop-color="#F0803C"/>
  </linearGradient></defs></svg>
<canvas id="fx" aria-hidden="true"></canvas>
<div id="app">
  <div class="who" id="who" role="group" aria-label="Vem är du?"></div>
  <main id="view"></main>
  <nav aria-label="Sidor">
    <a href="#morgon" data-tab="morgon">🌈 Morgon</a>
    <a href="#min-dag" data-tab="min-dag">☀️ Dag</a>
    <a href="#kvall" data-tab="kvall">🌙 Kväll</a>
    <a href="#for-vuxna" data-tab="for-vuxna" class="grown" aria-label="För vuxna">⚙️</a>
  </nav>
</div>
<script>
(function(){
"use strict";
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
var uid=function(){return Math.random().toString(36).slice(2,8)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};

var THEMES={
  unicorn:{pal:"🦄",goal:"🌟",cls:"",label:"Regnbåge",fin:"🦄🌟",party:["⭐","🌟","✨","💖"],
    hello:"God morgon! Jag följer med dig hela vägen över regnbågen."},
  dino:{pal:"🦖",goal:"🏁",cls:"t-dino",label:"Bilväg",fin:"🦖🏁",party:["⭐","🚗","🦕","🚙"],
    hello:"God morgon! Vi kör hela vägen till målflaggan."}
};
function defKid(theme){
  if(theme==="dino")return {id:"k2",name:"",theme:"dino",total:0,timers:true,
    steps:[
      {id:"b1",icon:"🛏️",name:"Vakna och kramas",min:3},
      {id:"b2",icon:"🚽",name:"Gå på toa",min:3},
      {id:"b3",icon:"👕",name:"Klä på dig",min:8},
      {id:"b4",icon:"🥣",name:"Äta frukost",min:15},
      {id:"b5",icon:"🪥",name:"Borsta tänderna",min:3},
      {id:"b6",icon:"🧥",name:"Ytterkläder på",min:6}
    ],
    day:[
      {id:"e1",icon:"🏫",name:"Dagis",note:"Lek med kompisarna"},
      {id:"e2",icon:"🍽️",name:"Lunch",note:""},
      {id:"e3",icon:"😴",name:"Vila",note:""},
      {id:"e4",icon:"🛝",name:"Utelek",note:""}
    ],
    pickup:"Mamma",pickupTime:"",treat:"Vi leker med bilarna tillsammans"};
  return {id:"k1",name:"",theme:"unicorn",total:0,timers:true,
    steps:[
      {id:"a1",icon:"🛏️",name:"Vakna och kramas",min:3},
      {id:"a2",icon:"🚽",name:"Gå på toa",min:3},
      {id:"a3",icon:"👕",name:"Klä på dig",min:8},
      {id:"a4",icon:"🥣",name:"Äta frukost",min:15},
      {id:"a5",icon:"🪥",name:"Borsta tänderna",min:3},
      {id:"a6",icon:"🎒",name:"Packa väskan",min:2},
      {id:"a7",icon:"🧥",name:"Ytterkläder på",min:6}
    ],
    day:[
      {id:"d1",icon:"🏫",name:"Förskola",note:"Lek och lär med kompisarna"},
      {id:"d2",icon:"🍽️",name:"Lunch",note:""},
      {id:"d3",icon:"🎨",name:"Eftis",note:"Mellanmål och lek"}
    ],
    pickup:"Mamma",pickupTime:"",treat:"Vi läser en saga tillsammans"};
}
function defEve(){return [
  {id:"n1",icon:"🧸",name:"Plocka undan",min:5},
  {id:"n2",icon:"🥪",name:"Kvällsmål",min:15},
  {id:"n3",icon:"🛁",name:"Tvätta dig",min:10},
  {id:"n4",icon:"👚",name:"Pyjamas på",min:5},
  {id:"n5",icon:"🪥",name:"Borsta tänderna",min:3},
  {id:"n6",icon:"🚽",name:"Gå på toa",min:3},
  {id:"n7",icon:"📖",name:"Saga i sängen",min:15},
  {id:"n8",icon:"🤗",name:"Godnattkram",min:0}
]}
var today=new Date().toDateString();
function normKid(k){
  if(!THEMES[k.theme])k.theme="unicorn";
  if(!k.id)k.id=uid();
  if(!Array.isArray(k.steps))k.steps=[];
  if(!Array.isArray(k.day))k.day=[];
  if(!Array.isArray(k.eve))k.eve=defEve();
  if(!k.prog||k.prog.date!==today)k.prog={date:today,idx:-1,start:0};
  if(!k.progE||k.progE.date!==today)k.progE={date:today,idx:-1,start:0};
  return k;
}
function newKid(){var k=defKid("unicorn");k.id=uid();k.pal="🐱";return normKid(k)}
var st=store.get("em.v3",null);
if(!st||!st.fams||!st.fams.length){
  /* Flytta över tidigare versioners inställningar till en första familj */
  var v2=store.get("em.v2",null), kids, act;
  if(v2&&v2.kids&&v2.kids.length){kids=v2.kids;act=v2.active}
  else{
    var k1=defKid("unicorn"), old=store.get("em.cfg",null);
    if(old){for(var key in old)k1[key]=old[key];k1.total=store.get("em.total",0);var op=store.get("em.prog",null);if(op)k1.prog=op}
    kids=[k1,defKid("dino")];act="k1";
  }
  st={fam:"f1",fams:[{id:"f1",name:"Vår familj",active:act,kids:kids}]};
}
st.fams.forEach(function(f){f.kids.forEach(normKid)});
var F;
function palOf(k){return k.pal||THEMES[k.theme].pal}
var cfg,prog,steps,mode="m";
function setMode(m){
  mode=m;steps=m==="e"?cfg.eve:cfg.steps;prog=m==="e"?cfg.progE:cfg.prog;
  document.body.className=T().cls+(m==="e"?" night":"");
}
function T(){
  var t=THEMES[cfg.theme],p=palOf(cfg);
  return {pal:p,goal:t.goal,cls:t.cls,label:t.label,fin:p+t.goal,party:t.party,hello:t.hello};
}
function pick(id){
  cfg=F.kids.filter(function(k){return k.id===id})[0]||F.kids[0];
  F.active=cfg.id;setMode(mode);
}
function pickFam(id){
  F=st.fams.filter(function(f){return f.id===id})[0]||st.fams[0];
  st.fam=F.id;pick(F.active);
}
pickFam(st.fam);
function listOf(a){
  return Array.isArray(a)?a.slice(0,20).map(function(x){x=x||{};return {id:uid(),icon:String(x.icon||"⭐").slice(0,8),name:String(x.name||"").slice(0,40),
    min:Math.max(0,Math.min(60,parseInt(x.min,10)||0)),note:String(x.note||"").slice(0,60)}}):null;
}
function cleanFam(o){
  if(!o||!Array.isArray(o.kids)||!o.kids.length)throw new Error("fel form");
  var f={id:uid(),name:String(o.name||"Familj").slice(0,40),kids:o.kids.slice(0,5).map(function(k){
    k=k||{};var d=defKid("unicorn");
    return normKid({id:uid(),name:String(k.name||"").slice(0,20),pal:String(k.pal||"").slice(0,8),theme:k.theme,
      total:Math.max(0,parseInt(k.total,10)||0),timers:k.timers!==false,
      steps:listOf(k.steps)||d.steps,eve:listOf(k.eve)||defEve(),day:listOf(k.day)||d.day,
      pickup:String(k.pickup||"").slice(0,30),pickupTime:String(k.pickupTime||"").slice(0,30),treat:String(k.treat||"").slice(0,60)});
  })};
  f.active=f.kids[0].id;return f;
}
function exportFam(){
  return JSON.stringify({name:F.name,kids:F.kids.map(function(k){
    var c=JSON.parse(JSON.stringify(k));delete c.prog;delete c.progE;delete c.id;return c})});
}
function renderWho(){
  var w=document.getElementById("who");
  w.hidden=F.kids.length<2&&!cfg.name;
  w.innerHTML=F.kids.map(function(k,i){
    return '<button data-kid="'+k.id+'" aria-pressed="'+(k.id===cfg.id)+'" aria-label="'+esc(k.name||("Barn "+(i+1)))+'"><span class="f">'+esc(palOf(k))+'</span><span class="nm">'+esc(k.name||"")+'</span></button>'}).join("");
}
document.getElementById("who").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  pick(b.dataset.kid);save();route();
});
var unlocked=false, tick=null;
var view=document.getElementById("view");
var save=function(){store.set("em.v3",st)};
var n=function(){return steps.length};
var doneCount=function(){return prog.idx<0?0:Math.min(prog.idx,n())};
var finished=function(){return n()>0&&prog.idx>=n()};

/* ---------- Regnbågen med enhörningen ---------- */
function skyHTML(){
  var cols=["var(--r1)","var(--r2)","var(--r3)","var(--r4)","var(--r5)","var(--r6)"],arcs="";
  for(var i=0;i<6;i++){var r=132-i*11;arcs+='<path d="M'+(160-r)+' 150 A'+r+' '+r+' 0 0 1 '+(160+r)+' 150" fill="none" stroke="'+cols[i]+'" stroke-width="11"/>'}
  if(cfg.theme==="dino"){
    arcs='<path d="M56 150 A104 104 0 0 1 264 150" fill="none" stroke="#8B93A1" stroke-width="46"/>'+
         '<path d="M56 150 A104 104 0 0 1 264 150" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="12 12"/>';
  }
  var bush=cfg.theme==="dino"?"#A6D9A2":"#fff", goal=T().goal;
  if(mode==="e"){
    arcs='<path d="M56 150 A104 104 0 0 1 264 150" fill="none" stroke="#C9C3F5" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13"/>';
    [[40,40],[95,22],[150,52],[205,18],[262,44],[300,90],[20,96],[160,110]].forEach(function(q,k){
      arcs+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(k%3?1.6:2.4)+'" fill="#FFE9A8"/>'});
    bush="#3A3B7C";goal="🌙";
  }
  var p=n()?doneCount()/n():0, th=Math.PI*(1-p), R=104;
  var x=(160+R*Math.cos(th))/320*100, y=(150-R*Math.sin(th))/160*100-6;
  var st="";for(var j=0;j<n();j++)st+='<i class="'+(j<doneCount()?"on":"")+'">⭐</i>';
  return '<div class="sky" role="img" aria-label="'+doneCount()+' av '+n()+' steg klara">'+
    '<svg viewBox="0 0 320 160" aria-hidden="true">'+arcs+
    '<ellipse cx="34" cy="150" rx="34" ry="13" fill="'+bush+'"/><ellipse cx="286" cy="150" rx="34" ry="13" fill="'+bush+'"/></svg>'+
    '<div class="goal" style="left:'+(264/320*100)+'%;top:82%">'+(finished()?"":goal)+'</div>'+
    '<div class="pal" style="left:'+x+'%;top:'+y+'%"><span>'+esc(T().pal)+'</span></div>'+
    '<div class="stars">'+st+'</div></div>';
}
function stripHTML(){
  return '<div class="strip" aria-label="Alla steg">'+steps.map(function(s,i){
    var c=i<doneCount()?"done":(i===prog.idx?"now":"");
    return '<div class="tile '+c+'" title="'+esc(s.name)+'">'+esc(s.icon)+'</div>'}).join("")+'</div>';
}

/* ---------- Morgon ---------- */
function renderMorning(){
  clearInterval(tick);
  var h=skyHTML();
  if(!n()){
    h+='<div class="bubble">Det finns inga steg än. En vuxen kan lägga till dem under För vuxna.</div>';
  }else if(prog.idx<0){
    h+='<div class="bubble">'+(mode==="e"?"Nu varvar vi ner. Jag följer med dig hela vägen till månen.":T().hello)+'</div>'+
       '<div class="step"><h2>'+n()+' saker, en i taget</h2>'+stripHTML()+
       '<button class="big" id="go">Vi börjar!</button></div>';
  }else if(finished()&&mode==="e"){
    h+='<div class="bubble">Sov gott. Vi ses i morgon.</div>'+
       '<div class="step"><div style="font-size:84px;line-height:1">'+esc(T().pal)+'💤</div><h2>God natt!</h2>'+
       '<div class="time">Du har samlat '+cfg.total+' stjärnor totalt</div><button class="sm" id="again">Börja om</button></div>';
  }else if(finished()){
    h+='<div class="bubble">Du gjorde det! Alla stjärnor är dina.</div>'+
       '<div class="step"><div style="font-size:84px;line-height:1">'+esc(T().fin)+'</div><h2>Morgonen är klar!</h2>'+
       '<div class="time">Du har samlat '+cfg.total+' stjärnor totalt</div>'+
       '<a class="big calm" style="text-align:center;text-decoration:none;display:block" href="#min-dag">Se min dag</a><button class="sm" id="again">Börja om</button></div>';
  }else{
    var s=steps[prog.idx], C=2*Math.PI*52;
    h+='<div class="bubble" id="say">Nu: '+esc(s.name)+'. Du klarar det!</div>'+
       '<div class="step"><div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true">'+
       '<circle class="track" cx="60" cy="60" r="52"/>'+
       '<circle class="left" id="arc" cx="60" cy="60" r="52" stroke-dasharray="'+C+'" stroke-dashoffset="0"/></svg>'+
       '<div class="pic">'+esc(s.icon)+'</div></div>'+
       '<h2>'+esc(s.name)+'</h2><div class="time" id="time" aria-live="off"></div>'+
       '<button class="big" id="done">Klar! ⭐</button></div>'+stripHTML();
  }
  view.innerHTML=h;
  var go=document.getElementById("go"), dn=document.getElementById("done");
  var ag=document.getElementById("again");
  if(ag) ag.onclick=function(){prog.idx=-1;save();renderMorning()};
  if(go) go.onclick=function(){prog.idx=0;prog.start=Date.now();save();renderMorning()};
  if(dn){
    dn.onclick=function(){
      prog.idx++;prog.start=Date.now();cfg.total=(cfg.total||0)+1;save();
      if(mode==="m"){if(finished()) party(60); else party(8)}
      renderMorning();
    };
    updateTimer();tick=setInterval(updateTimer,1000);
  }
}
function updateTimer(){
  var arc=document.getElementById("arc"),t=document.getElementById("time"),s=steps[prog.idx];
  if(!arc||!s){clearInterval(tick);return}
  var C=2*Math.PI*52;
  if(!cfg.timers||!(s.min>0)){arc.style.strokeDashoffset=0;t.textContent="";return}
  var tot=s.min*60, rem=tot-(Date.now()-prog.start)/1000;
  if(rem<=0){
    arc.style.strokeDashoffset=C;t.textContent="";
    document.getElementById("say").textContent="Ingen brådska. Tryck när du är klar.";
  }else{
    arc.style.strokeDashoffset=C*(1-rem/tot);
    t.textContent=rem>=60?Math.ceil(rem/60)+" min kvar":"Snart klar";
  }
}

/* ---------- Min dag ---------- */
function renderDay(){
  clearInterval(tick);setMode("m");
  var parts=['<div class="part '+(finished()?"done":"")+'"><div class="ic">🌈</div><div><h3>Morgon hemma</h3><p>'+
    (finished()?"Klar! "+n()+" stjärnor":doneCount()+" av "+n()+" stjärnor")+'</p></div></div>'];
  cfg.day.forEach(function(d){
    parts.push('<div class="part"><div class="ic">'+esc(d.icon)+'</div><div><h3>'+esc(d.name)+'</h3>'+(d.note?'<p>'+esc(d.note)+'</p>':'')+'</div></div>');
  });
  parts.push('<div class="part hug"><div class="ic">🤗</div><div><h3>'+esc(cfg.pickup||"Vi")+' hämtar dig</h3>'+
    (cfg.pickupTime?'<p>'+esc(cfg.pickupTime)+'</p>':'')+'</div></div>');
  parts.push('<div class="part home"><div class="ic">🏠</div><div><h3>Hemma igen</h3>'+(cfg.treat?'<p>'+esc(cfg.treat)+'</p>':'')+'</div></div>');
  if(cfg.eve.length)parts.push('<div class="part"><div class="ic">🌙</div><div><h3>Kväll och god natt</h3></div></div>');
  var last=cfg.day.length?cfg.day[cfg.day.length-1].name:"";
  view.innerHTML='<h1 style="font-size:32px;text-align:center">'+(cfg.name?esc(cfg.name)+"s dag":"Min dag")+'</h1>'+
    '<div class="bubble">'+esc(T().pal)+' Så här ser dagen ut. '+(last?"Efter "+esc(last.toLowerCase())+" blir du alltid hämtad.":"Sen blir du hämtad.")+'</div>'+
    '<div class="day">'+parts.join('<div class="arrow" aria-hidden="true">▼</div>')+'</div>';
}

/* ---------- För vuxna ---------- */
function rowHTML(kind,it,i,len){
  var min=kind!=="day";
  return '<div class="row '+(min?"":"nomin")+'" data-kind="'+kind+'" data-i="'+i+'">'+
    '<input class="em" type="text" id="'+kind+'-icon-'+it.id+'" data-f="icon" value="'+esc(it.icon)+'" aria-label="Bild (emoji)" maxlength="8">'+
    '<input type="text" id="'+kind+'-name-'+it.id+'" data-f="name" value="'+esc(it.name)+'" aria-label="Namn">'+
    (min?'<input type="number" id="'+kind+'-min-'+it.id+'" data-f="min" value="'+esc(it.min)+'" min="0" max="60" inputmode="numeric" aria-label="Minuter">':'')+
    (min?'':'<input type="text" style="grid-column:1/-1" id="'+kind+'-note-'+it.id+'" data-f="note" value="'+esc(it.note)+'" placeholder="Liten förklaring (valfritt)" aria-label="Förklaring">')+
    '<div class="acts"><button class="sm" data-a="up" '+(i===0?"disabled":"")+' aria-label="Flytta upp">▲</button>'+
    '<button class="sm" data-a="down" '+(i===len-1?"disabled":"")+' aria-label="Flytta ner">▼</button>'+
    '<button class="sm warn" data-a="del">Ta bort</button></div></div>';
}
function renderAdult(){
  clearInterval(tick);setMode("m");
  if(!unlocked){
    var opts=[24,42,44].sort(function(){return Math.random()-.5});
    view.innerHTML='<div class="adult" style="display:flex;flex-direction:column;gap:14px"><h2>För vuxna</h2>'+
      '<p>Tryck på talet fyrtiotvå för att öppna inställningarna.</p><div class="gate">'+
      opts.map(function(o){return '<button data-g="'+o+'">'+o+'</button>'}).join("")+'</div></div>';
    view.querySelector(".gate").onclick=function(e){
      var g=e.target.getAttribute("data-g");if(!g)return;
      if(g==="42"){unlocked=true;renderAdult()}else{location.hash="#morgon"}
    };
    return;
  }
  view.innerHTML='<div class="adult" style="display:flex;flex-direction:column;gap:12px"><h2>För vuxna</h2>'+
    '<p>Ändringar sparas direkt på den här telefonen.</p>'+
    '<h3>Familj</h3>'+
    '<label class="field" for="famsel">Familj som används på den här telefonen<select id="famsel">'+st.fams.map(function(f){
      return '<option value="'+f.id+'" '+(f.id===F.id?"selected":"")+'>'+esc(f.name||"Familj")+'</option>'}).join("")+'</select></label>'+
    '<label class="field" for="famname">Familjens namn<input type="text" id="famname" value="'+esc(F.name)+'" maxlength="40"></label>'+
    '<div class="btns"><button class="sm" id="add-fam">+ Ny familj</button>'+
    (st.fams.length>1?'<button class="sm warn" id="del-fam">Ta bort familjen</button>':'')+'</div>'+
    '<h3>Barn: '+esc(cfg.name||"utan namn")+'</h3>'+
    '<p>Välj barn med knapparna högst upp. Allt härifrån och ner till Flytta inställningar gäller det valda barnet.</p>'+
    '<label class="field" for="kidname">Barnets namn<input type="text" id="kidname" value="'+esc(cfg.name)+'" placeholder="Syns på knappen högst upp" maxlength="20"></label>'+
    '<label class="field" for="kidpal">Barnets figur (en emoji, till exempel 🦄 🦖 🐱 🚀)<input class="em" style="width:80px" type="text" id="kidpal" value="'+esc(palOf(cfg))+'" maxlength="8"></label>'+
    '<div class="radios" role="radiogroup" aria-label="Tema">'+Object.keys(THEMES).map(function(k){
      return '<label for="theme-'+k+'"><input type="radio" name="theme" id="theme-'+k+'" value="'+k+'" '+(cfg.theme===k?"checked":"")+'> '+THEMES[k].pal+' '+THEMES[k].label+'</label>'}).join("")+'</div>'+
    '<div class="btns">'+(F.kids.length<5?'<button class="sm" id="add-kid">+ Lägg till barn</button>':'')+
    (F.kids.length>1?'<button class="sm warn" id="del-kid">Ta bort det här barnet</button>':'')+'</div>'+
    '<h3>Morgonens steg</h3><p>Bild, namn och antal minuter. 0 minuter betyder ingen timer för det steget.</p>'+
    '<div class="list">'+cfg.steps.map(function(s,i){return rowHTML("steps",s,i,n())}).join("")+'</div>'+
    '<button class="sm" id="add-step">+ Lägg till steg</button>'+
    '<label class="chk" for="timers"><input type="checkbox" id="timers" '+(cfg.timers?"checked":"")+'> Visa timer runt bilden</label>'+
    '<h3>Kvällens steg</h3><p>Nattningen visas med mörk, lugn skärm och utan stjärnregn.</p>'+
    '<div class="list">'+cfg.eve.map(function(s,i){return rowHTML("eve",s,i,cfg.eve.length)}).join("")+'</div>'+
    '<button class="sm" id="add-eve">+ Lägg till kvällssteg</button>'+
    '<h3>Dagen efter morgonen</h3>'+
    '<div class="list">'+cfg.day.map(function(d,i){return rowHTML("day",d,i,cfg.day.length)}).join("")+'</div>'+
    '<button class="sm" id="add-day">+ Lägg till del av dagen</button>'+
    '<label class="field" for="pickup">Vem hämtar i dag?<input type="text" id="pickup" value="'+esc(cfg.pickup)+'" placeholder="Mamma, Pappa, Mormor"></label>'+
    '<label class="field" for="pickupTime">När? (valfritt, så som ni brukar säga det)<input type="text" id="pickupTime" value="'+esc(cfg.pickupTime)+'" placeholder="Efter mellanmålet"></label>'+
    '<label class="field" for="treat">Något att se fram emot hemma<input type="text" id="treat" value="'+esc(cfg.treat)+'"></label>'+
    '<h3>Flytta inställningar</h3>'+
    '<p>Kopiera familjens kod och klistra in den i appen på en annan telefon, eller spara den som reservkopia.</p>'+
    '<textarea id="code" rows="3" aria-label="Kod med familjens inställningar" placeholder="Klistra in en kod här"></textarea>'+
    '<div class="btns"><button class="sm" id="show-code">Visa och kopiera koden</button><button class="sm" id="load-code">Läs in inklistrad kod</button></div>'+
    '<p id="codemsg" role="status"></p>'+
    '<h3>Återställ</h3>'+
    '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="sm" id="redo">Börja om dagens morgon</button>'+
    '<button class="sm" id="redo-eve">Börja om kvällen</button>'+
    '<button class="sm warn" id="zero">Nollställ stjärnorna ('+(cfg.total||0)+')</button></div></div>';
}
view.addEventListener("input",function(e){
  var t=e.target, row=t.closest&&t.closest(".row");
  if(row){
    var it=cfg[row.dataset.kind][+row.dataset.i], f=t.dataset.f;
    it[f]=f==="min"?Math.max(0,Math.min(60,parseInt(t.value,10)||0)):t.value;
  }else if(t.id==="pickup"||t.id==="pickupTime"||t.id==="treat"){cfg[t.id]=t.value}
  else if(t.id==="timers"){cfg.timers=t.checked}
  else if(t.id==="kidname"){cfg.name=t.value;renderWho()}
  else if(t.id==="kidpal"){cfg.pal=t.value.trim();renderWho()}
  else if(t.id==="famname"){F.name=t.value}
  else if(t.id==="famsel"){pickFam(t.value);save();renderWho();renderAdult();return}
  else if(t.name==="theme"){cfg.theme=t.value;document.body.className=T().cls;renderWho()}
  else return;
  save();
});
view.addEventListener("click",function(e){
  var t=e.target;if(!unlocked||!t.closest(".adult"))return;
  var row=t.closest(".row"), a=t.dataset.a;
  if(row&&a){
    var arr=cfg[row.dataset.kind], i=+row.dataset.i;
    if(a==="del")arr.splice(i,1);
    if(a==="up"&&i>0)arr.splice(i-1,0,arr.splice(i,1)[0]);
    if(a==="down"&&i<arr.length-1)arr.splice(i+1,0,arr.splice(i,1)[0]);
    if(row.dataset.kind==="steps"){cfg.prog.idx=-1}
    if(row.dataset.kind==="eve"){cfg.progE.idx=-1}
  }else if(t.id==="add-step"){cfg.steps.push({id:uid(),icon:"⭐",name:"Nytt steg",min:5});cfg.prog.idx=-1}
  else if(t.id==="add-eve"){cfg.eve.push({id:uid(),icon:"⭐",name:"Nytt steg",min:5});cfg.progE.idx=-1}
  else if(t.id==="add-day"){cfg.day.push({id:uid(),icon:"🎈",name:"Ny del",note:""})}
  else if(t.id==="redo"){cfg.prog.idx=-1;save();location.hash="#morgon";return}
  else if(t.id==="redo-eve"){cfg.progE.idx=-1;save();location.hash="#kvall";return}
  else if(t.id==="zero"){cfg.total=0}
  else if(t.id==="add-fam"){var nf={id:uid(),name:"Ny familj",kids:[newKid()]};nf.active=nf.kids[0].id;st.fams.push(nf);pickFam(nf.id)}
  else if(t.id==="add-kid"){var nk=newKid();F.kids.push(nk);pick(nk.id)}
  else if(t.id==="del-fam"||t.id==="del-kid"){
    if(!t.dataset.sure){t.dataset.sure="1";t.textContent="Tryck igen för att ta bort";return}
    if(t.id==="del-fam"){st.fams.splice(st.fams.indexOf(F),1);pickFam(st.fams[0].id)}
    else{F.kids.splice(F.kids.indexOf(cfg),1);pick(F.kids[0].id)}
  }
  else if(t.id==="show-code"){
    var ta=document.getElementById("code"),msg=document.getElementById("codemsg");
    ta.value=exportFam();ta.focus();ta.select();
    msg.textContent="Koden står i rutan. Markera och kopiera den om den inte kopierades av sig själv.";
    try{navigator.clipboard.writeText(ta.value).then(function(){msg.textContent="Koden är kopierad."},function(){})}catch(err){}
    return;
  }
  else if(t.id==="load-code"){
    var nf2;
    try{nf2=cleanFam(JSON.parse(document.getElementById("code").value))}
    catch(err){document.getElementById("codemsg").textContent="Koden gick inte att läsa. Kopiera hela koden från den andra telefonen och försök igen.";return}
    st.fams.push(nf2);pickFam(nf2.id);
  }
  else return;
  save();renderWho();renderAdult();
});

/* ---------- Stjärnregn ---------- */
function party(count){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=document.getElementById("fx"),x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight;
  var em=T().party,ps=[];
  for(var i=0;i<count;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*.4,v:2+Math.random()*4,s:18+Math.random()*22,e:em[i%4],w:Math.random()*6});
  var t0=performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);
    ps.forEach(function(p){p.y+=p.v;p.x+=Math.sin((t+p.w*300)/300);x.font=p.s+"px serif";x.fillText(p.e,p.x,p.y)});
    if(t-t0<3200)requestAnimationFrame(f);else x.clearRect(0,0,W,H);
  })(t0);
}

/* ---------- Sidor ---------- */
function route(){
  var h=location.hash.slice(1)||(new Date().getHours()>=16?"kvall":"morgon");
  if(h!=="min-dag"&&h!=="for-vuxna"&&h!=="kvall")h="morgon";
  if(h!=="for-vuxna")unlocked=false;
  renderWho();
  Array.prototype.forEach.call(document.querySelectorAll("nav a"),function(a){
    if(a.dataset.tab===h)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  if(h==="min-dag")renderDay();else if(h==="for-vuxna")renderAdult();else{setMode(h==="kvall"?"e":"m");renderMorning()}
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
route();
})();
</script>

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(function(){})}
