<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rutiner</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rutiner">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#EEF4FF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: en skärm i taget på telefon. Regnbågen överst visar hur långt vi kommit,
   ett stort kort visar det enda steg som gäller just nu. En värld, ett ljust tema. */
:root{
  color-scheme: light;
  --sky:#EEF4FF; --sky-2:#FBEFFA;
  --ink:#3A2A5E; --ink-soft:#75689A;
  --card:#FFFFFF; --line:#E1D9F5;
  --accent:#D9408A; --accent-deep:#A82B67; --accent-ink:#FFFFFF;
  --sun:#FFC53D; --mint:#2FB89A;
  --r1:#F4627D; --r2:#FFA347; --r3:#FFD84D; --r4:#5CCB8B; --r5:#5AA9F0; --r6:#A07BEA;
  --display:"Baloo 2","Nunito",system-ui,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
body.t-dino{--sky:#EAF6E4;--sky-2:#FFF6DC;--accent:#2F8F4E;--accent-deep:#1F6B38;--line:#D3E4CA;--ink:#243B2A;--ink-soft:#5F7A66}
.t-dino .ring .left{stroke:url(#rd)}
body.night{color-scheme:dark;--sky:#171A45;--sky-2:#2A2360;--ink:#F1ECFF;--ink-soft:#B9B2DA;--card:#2C2D68;--line:#4B4B8E;--accent:#7C6BE0;--accent-deep:#5445B4}
.night .step{box-shadow:none}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:linear-gradient(180deg,var(--sky),var(--sky-2));background-attachment:fixed;
  color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.35;-webkit-tap-highlight-color:transparent}
#app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:12px 16px 0}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--r5);outline-offset:3px}
main{flex:1;display:flex;flex-direction:column;gap:14px;padding-bottom:104px}

/* Vem är jag */
.who{display:flex;gap:10px;margin-bottom:10px}
.who button{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--line);background:var(--card);
  border-radius:999px;padding:4px 10px;font-family:var(--display);font-weight:800;font-size:20px;min-height:54px;opacity:.55}
.who button[aria-pressed=true]{border-color:var(--accent);opacity:1}
.who .f{font-size:32px;line-height:1}
.who button{min-width:0}
.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who[hidden]{display:none}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.radios{display:flex;gap:8px;flex-wrap:wrap}
.radios label{flex:1;display:flex;gap:8px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:8px 10px;font-weight:700}

/* Regnbågen */
.sky{position:relative;width:100%;aspect-ratio:320/160}
.sky svg{position:absolute;inset:0;width:100%;height:100%}
.pal,.goal{position:absolute;transform:translate(-50%,-50%);font-size:44px;line-height:1}
.pal{transition:left .9s ease,top .9s ease;z-index:2}
.pal span{display:inline-block;transform:scaleX(-1)}
.goal{font-size:34px}
.stars{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:3px;flex-wrap:wrap;padding:0 48px}
.stars i{font-style:normal;font-size:17px;filter:grayscale(1);opacity:.28}
.stars i.on{filter:none;opacity:1;animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.5)}100%{transform:scale(1)}}

.bubble{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:10px 14px;font-weight:700;text-align:center}

/* Stegkortet */
.step{background:var(--card);border-radius:28px;padding:18px 16px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;
  box-shadow:0 8px 24px rgba(88,60,150,.13)}
.ring{position:relative;width:min(56vw,210px);aspect-ratio:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .track{fill:none;stroke:var(--line);stroke-width:10}
.ring .left{fill:none;stroke:url(#rb);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1s linear}
.ring .pic{position:absolute;inset:0;display:grid;place-items:center;font-size:min(26vw,96px);line-height:1}
.step h2{font-size:34px;text-align:center}
.time{color:var(--ink-soft);font-weight:700;font-size:16px;min-height:1.35em}
.big{border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:800;
  font-size:28px;padding:12px 20px;width:100%;min-height:68px;box-shadow:0 6px 0 var(--accent-deep)}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--accent-deep)}
.big.calm{background:var(--mint);box-shadow:0 6px 0 #1F8A72}
.big.calm:active{box-shadow:0 2px 0 #1F8A72}

/* Bildremsan */
.strip{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.step .strip{align-self:stretch;min-width:0}
.tile{flex:0 0 62px;height:62px;border-radius:16px;background:var(--card);border:2px solid var(--line);display:grid;place-items:center;font-size:30px;position:relative}
.tile.done{opacity:.55}
.tile.done::after{content:"⭐";position:absolute;right:-6px;top:-8px;font-size:20px}
.tile.now{border-color:var(--accent);border-width:4px;transform:scale(1.06)}

/* Min dag */
.day{display:flex;flex-direction:column;gap:6px}
.part{display:flex;align-items:center;gap:14px;background:var(--card);border:2px solid var(--line);border-radius:22px;padding:12px 16px}
.part .ic{font-size:44px;line-height:1;flex:0 0 52px;text-align:center}
.part h3{font-size:24px}
.part p{margin:2px 0 0;color:var(--ink-soft);font-weight:700;font-size:16px}
.part.done{opacity:.6}
.part.hug{background:#FFF1C9;border-color:var(--sun)}
.part.hug h3{font-size:28px}
.part.home{background:#E6F8F1;border-color:var(--mint)}
.arrow{text-align:center;color:var(--ink-soft);font-size:20px;line-height:1}

/* För vuxna */
.adult{font-size:16px}
.adult h2{font-size:26px}
.adult h3{font-size:20px;margin-top:8px}
.adult p{margin:4px 0;color:var(--ink-soft)}
.row{display:grid;grid-template-columns:52px 1fr 58px;gap:6px;align-items:center;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px}
.row.nomin{grid-template-columns:52px 1fr}
.row .acts{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:#fff;border:2px solid var(--line);border-radius:10px;padding:8px;width:100%;min-width:0}
input.em{text-align:center;font-size:22px;padding:6px 2px}
.sm{border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-weight:700;min-height:40px}
.sm.warn{border-color:var(--r1);color:#B3243F}
.field{display:flex;flex-direction:column;gap:4px;font-weight:700}
.list{display:flex;flex-direction:column;gap:8px}
.gate{display:flex;gap:10px;justify-content:center}
.gate button{flex:1;font-family:var(--display);font-size:28px;border-radius:16px;border:2px solid var(--line);background:var(--card);padding:14px 0}
label.chk{display:flex;gap:10px;align-items:center;font-weight:700}
label.chk input{width:24px;height:24px}

/* Dagens väg */
.stop{display:grid;grid-template-columns:44px 56px 1fr;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);
  border-radius:22px;padding:10px 14px;text-decoration:none;color:var(--ink);min-height:76px}
.stop.now{border-color:var(--accent);border-width:4px;box-shadow:0 8px 24px rgba(88,60,150,.13)}
.stop.done{opacity:.8}
.stop .pal2{font-size:36px;line-height:1;text-align:center}
.stop .pal2 span{display:inline-block;transform:scaleX(-1)}
.stop.done .pal2{font-size:26px}
.stop .ic{font-size:42px;line-height:1;text-align:center}
.stop .tx{display:flex;flex-direction:column;gap:6px;min-width:0}
.stop b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.stop.now b{font-size:28px}
.dots{display:flex;gap:5px;flex-wrap:wrap}
.dots i{width:11px;height:11px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--sun)}
.part.hug.now{border-width:4px;border-color:var(--accent)}
.part.hug.done{opacity:.85}
.part.hug .hugtx{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.part.hug .hugtx p{margin:0}
.part.hug .flip{display:inline-block;transform:scaleX(-1)}
.big.hugbtn{font-size:22px;min-height:54px;padding:8px 14px;margin-top:4px}
.btns.undo{justify-content:center}
.ptitle{font-size:24px;text-align:center}
.night .part.hug{background:#4A4222}
.night .part.hug p{color:var(--ink)}
details.pt{background:var(--card);border:2px solid var(--line);border-radius:14px}
details.pt summary{padding:12px;font-weight:800;cursor:pointer}
details.pt summary small{font-weight:700;color:var(--ink-soft);margin-left:6px}
details.pt .ptb{display:flex;flex-direction:column;gap:8px;padding:0 10px 12px}
details.pt .row{background:var(--sky)}

/* Skolläge, hjälpkort, vuxenvy och utskrift */
.lbl{font-size:14px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-soft)}
.hint{color:var(--ink-soft);font-weight:700;margin:0}
.hint.center{text-align:center}
body.school main{gap:10px}
.mini{position:relative;height:36px;margin:0 22px}
.mini .bar{position:absolute;left:0;right:0;bottom:6px;height:12px;border-radius:999px;border:2px solid var(--card);
  background:linear-gradient(90deg,var(--r1),var(--r2),var(--r3),var(--r4),var(--r5),var(--r6))}
.t-dino .mini .bar{background:repeating-linear-gradient(90deg,#8B93A1 0 14px,#fff 14px 22px);border-color:#8B93A1}
.mini .mpal{position:absolute;bottom:2px;transform:translateX(-50%);font-size:32px;line-height:1;transition:left .8s ease}
.mini .mpal span{display:inline-block;transform:scaleX(-1)}
.mini .mgoal{position:absolute;right:-22px;bottom:0;font-size:26px;line-height:1}
.nowcard{background:var(--card);border:4px solid var(--accent);border-radius:26px;padding:12px 14px 14px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.nowcard .pic{font-size:68px;line-height:1.05}
.nowcard h2{font-size:30px}
.nowcard .when{margin:0;font-weight:800;font-size:20px}
.nextcard,.pickrow{display:grid;grid-template-columns:52px 1fr auto;align-items:center;gap:4px 12px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px 14px;text-align:left;color:var(--ink);width:100%}
.nextcard .lbl{grid-column:1/-1}
.nextcard .ic,.pickrow .ic{font-size:38px;line-height:1;text-align:center}
.nextcard .tx,.pickrow .tx{display:flex;flex-direction:column;min-width:0}
.nextcard b,.pickrow b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.nextcard small,.pickrow small,.stop small{font-weight:700;color:var(--ink-soft);font-size:15px}
.pickrow{min-height:64px;font:inherit;margin-bottom:8px}
.pickrow.cur{border:4px solid var(--accent)}
.pickrow .tag{border:2px solid var(--line);border-radius:999px;padding:2px 10px}
.btns.two{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.btns.two .big{min-height:60px;font-size:26px;padding:8px 12px}
.sm.tall{min-height:60px;border-radius:999px}
.sm.strong{border-color:var(--accent);border-width:3px;font-weight:800}
a.sm{display:inline-block;text-decoration:none;color:var(--ink);text-align:center}
.chipline{display:flex;align-items:center;gap:8px;width:100%;text-align:left;font:inherit;font-weight:700;color:var(--ink);background:var(--card);border:2px dashed var(--line);border-radius:16px;padding:6px 12px;min-height:42px}
.chipline b{margin-left:auto;text-decoration:underline}
.chipline.plain{border-style:solid}
.ph{width:44px;height:44px;border-radius:50%;object-fit:cover;flex:0 0 auto;border:2px solid var(--line);display:inline-grid;place-items:center;font-size:26px;background:var(--card)}
.ph.lg{width:64px;height:64px;font-size:40px}
.ph.emo{border-color:transparent;background:transparent}
.adultrow{display:flex;align-items:center;gap:10px;font-weight:700}
.part.hug{flex-wrap:wrap}
.part.hug>.sm{flex:1 0 100%;min-height:46px}
.part.hug.compact{padding:8px 12px;gap:6px 12px}
.part.hug.compact>.sm{min-height:44px}
.part.hug.compact .hugtx{gap:2px}
.part.hug.compact .ph.lg{width:48px;height:48px;font-size:32px}
.part.hug.compact p{font-size:15px}
body.school main{padding-bottom:92px}
.part.hug.compact h3{font-size:22px}
.part.hug small.lbl{color:var(--ink-soft)}

.ov{position:fixed;inset:0;z-index:20;overflow:auto;background:linear-gradient(180deg,var(--sky),var(--sky-2));padding:16px}
.ov[hidden]{display:none}
.ovin{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.ovin h3{font-size:18px;margin-top:6px}
.helpgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.helpcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:150px;font:inherit;color:var(--ink);background:var(--card);border:3px solid var(--line);border-radius:22px;padding:10px;text-align:center}
.helpcard .pic{font-size:56px;line-height:1}
.helpcard b{font-family:var(--display);font-weight:800;font-size:20px;line-height:1.15}
.helpbig{display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center;background:var(--card);border:4px solid var(--accent);border-radius:28px;padding:28px 16px;margin-top:8vh}
.helpbig .pic{font-size:140px;line-height:1}
.helpbig h2{font-size:36px}
details.note{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px}
details.note summary{font-weight:800;cursor:pointer}
.adult h4{font-family:var(--display);font-size:18px;margin:6px 0 0}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:8px}
.card h4{margin:0}
.card p,.secb p{margin:0}
.warnbox{border:2px solid #B3243F;border-radius:10px;padding:8px 10px;color:var(--ink)!important;background:#FFF4F6}
.ok{border:2px solid var(--mint);border-radius:10px;padding:8px 10px;color:var(--ink)!important;background:#EEFAF6}
.wd{display:flex;gap:6px;flex-wrap:wrap}
.wd .sm[aria-pressed=true]{border-color:var(--accent);border-width:3px}
.wd .sm[aria-pressed=false]{color:var(--ink-soft);text-decoration:line-through}
.pers{display:grid;grid-template-columns:44px 1fr;gap:8px 10px;align-items:end}
.pers .btns{grid-column:1/-1}
details.sec{background:var(--card);border:2px solid var(--line);border-radius:14px}
details.sec>summary{padding:14px 12px;font-family:var(--display);font-weight:800;font-size:19px;cursor:pointer}
details.sec .secb{display:flex;flex-direction:column;gap:10px;padding:0 12px 14px}
details.sec details.pt{background:var(--sky)}
details.sec details.pt .row{background:var(--card)}
.sched{display:flex;flex-direction:column;gap:8px}
.phead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:4px}
.phead>b{font-family:var(--display);font-weight:800;font-size:20px}
.phead .adultrow{font-size:15px}
.phead .ph{width:34px;height:34px;font-size:20px}
.chk-row{display:grid;grid-template-columns:52px 48px 1fr auto;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:8px 12px;min-height:68px;cursor:pointer}
.chk-row .ic{font-size:38px;line-height:1;text-align:center}
.chk-row .ph{width:46px;height:46px;font-size:34px}
.chk-row .tx{display:flex;flex-direction:column;min-width:0}
.chk-row b{font-family:var(--display);font-weight:800;font-size:24px;line-height:1.1}
.chk-row small{font-weight:700;color:var(--ink-soft);font-size:15px}
.chk-row .tag{border:2px solid var(--accent);border-radius:999px;padding:2px 10px;color:var(--ink);font-weight:800}
.chk-row.next{border:4px solid var(--accent);box-shadow:0 8px 24px rgba(88,60,150,.13)}
.chk-row.done{opacity:.72;background:var(--sky)}
.chk-row.pickup{background:#FFF1C9;border-color:var(--sun)}
.chk-row.pickup.next{border-color:var(--accent)}
.bigbox{appearance:none;-webkit-appearance:none;margin:0;width:48px;height:48px;border:3px solid var(--ink);border-radius:12px;background:#fff;display:grid;place-items:center;cursor:pointer}
.bigbox:checked{background:#DFF5EC}
.bigbox:checked::after{content:"✔";font-size:32px;line-height:1;color:var(--ink)}
.peekbar{display:block;text-align:center;font-weight:700;font-size:15px;color:var(--ink);background:#FFF4F6;border:2px solid #B3243F;border-radius:12px;padding:6px 10px;text-decoration:none}
.peekbar b{text-decoration:underline}
.todo{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.todo.num{list-style:decimal;padding-left:22px}
.todo.num li{padding-left:2px}
.status{margin:0;padding-left:20px}
.row.away{grid-template-columns:52px 1fr 76px}
textarea{resize:vertical}
.sheet{background:#fff;color:#111;border:2px solid var(--line);border-radius:14px;padding:16px;font-size:16px}
.sheet h3{margin-top:12px;font-size:20px}
.sheet h3 small{font-family:var(--body);font-weight:700;font-size:14px}
.plist{list-style:none;margin:6px 0;padding:0}
.plist li{display:grid;grid-template-columns:44px 1fr auto 28px;align-items:center;gap:8px;border-bottom:1px solid #999;padding:6px 0;font-size:18px}
.plist .ic{font-size:30px;text-align:center}
.plist .box{width:24px;height:24px;border:2px solid #111;border-radius:4px}
.pline{font-size:18px}
.pcards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pcard{border:3px solid #111;border-radius:16px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:10px;break-inside:avoid}
.pcard .pic{font-size:72px;line-height:1}
.pcard b{font-size:22px}
@media (min-width:700px){#app,nav,.ovin{max-width:600px}}
@media print{
  body{background:#fff!important}
  nav,.who,.noprint,#fx{display:none!important}
  #app{max-width:none;padding:0}
  main{padding:0}
  .sheet{border:0;padding:0;break-after:page}
  .sheet:last-child{break-after:auto}
}

nav{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:460px;margin:0 auto;display:flex;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom, 0px));background:linear-gradient(180deg,transparent,var(--sky-2) 35%)}
nav a{flex:1;text-align:center;text-decoration:none;color:var(--ink);font-weight:800;font-size:16px;white-space:nowrap;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 2px}
nav a[aria-current=page]{border-color:var(--accent);color:var(--accent)}
nav a.grown{flex:0 0 auto;padding:10px 14px;color:var(--ink-soft);font-weight:700;font-size:15px;display:grid;place-items:center}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:9}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="rb" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#F4627D"/><stop offset=".25" stop-color="#FFA347"/><stop offset=".5" stop-color="#FFD84D"/>
    <stop offset=".7" stop-color="#5CCB8B"/><stop offset=".85" stop-color="#5AA9F0"/><stop offset="1" stop-color="#A07BEA"/>
  </linearGradient>
  <linearGradient id="rd" x1="0" y1="0" x2="1" y2="1">

<script>
(function(){
"use strict";
var store={
  get:function(k,d){try{var v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},
  set:function(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}
};
var uid=function(){return Math.random().toString(36).slice(2,8)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var $=function(id){return document.getElementById(id)};
function pad(n){return (n<10?"0":"")+n}
function iso(d){d=d||new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function fmt(ts){if(!ts)return "aldrig";var d=new Date(ts);return d.getDate()+"."+(d.getMonth()+1)+" kl. "+pad(d.getHours())+"."+pad(d.getMinutes())}
function fmtDate(s){var a=String(s||"").split("-");return a.length===3?(+a[2])+"."+(+a[1])+"."+a[0]:String(s||"")}
function poss(n){return /[sxz]$/i.test(n)?n:n+"s"}
var WD=["Sö","Må","Ti","On","To","Fr","Lö"],WDL=["söndag","måndag","tisdag","onsdag","torsdag","fredag","lördag"];

var THEMES={
  unicorn:{pal:"🦄",goal:"🌟",cls:"",label:"Regnbåge",party:["⭐","🌟","✨","💖"],
    hello:"God morgon! Jag följer med dig hela vägen över regnbågen."},
  dino:{pal:"🦖",goal:"🏁",cls:"t-dino",label:"Bilväg",party:["⭐","🚗","🦕","🚙"],
    hello:"God morgon! Vi kör hela vägen till målflaggan."}
};
var KINDS={home:"Hemma",away:"Förskola, eftis eller annat borta (skolläge)",night:"Kväll hemma, mörk och lugn skärm"};
var HELP=[["🪑","Sitt med mig."],["💗","Jag saknar mamma eller pappa."],["🌧️","Något känns jobbigt."],["👉","Jag vill visa utan att prata."]];
/* Exempel på steg: [bild, namn, minuter]. Stegen för förskola, eftis och dagis är bara exempel tills en vuxen har bekräftat dem. */
var L={
  morning:[["🛏️","Vakna och kramas",3],["🚽","Gå på toa",3],["👕","Klä på dig",8],["🥣","Äta frukost",15],["🪥","Borsta tänderna",3],["🎒","Packa väskan",2],["🧥","Ytterkläder på",6]],
  morningSmall:[["🛏️","Vakna och kramas",3],["🚽","Gå på toa",3],["👕","Klä på dig",8],["🥣","Äta frukost",15],["🪥","Borsta tänderna",3],["🧥","Ytterkläder på",6]],
  forskola:[["👋","Vi säger hej då"],["🧩","Lek och lär"],["🍽️","Lunch"],["🌳","Utelek"]],
  eftis:[["🥪","Mellanmål"],["🎲","Lek och pyssel"],["🌳","Utelek"]],
  dagis:[["👋","Vi säger hej då"],["🧸","Lek"],["🍽️","Lunch"],["😴","Vila"],["🛝","Utelek"]],
  home:[["🧥","Hänga upp kläderna",3],["🧼","Tvätta händerna",2],["🍎","Mellanmål",10],["🧸","Lek och vila",0]],
  eve:[["🧸","Plocka undan",5],["🥪","Kvällsmål",15],["🛁","Tvätta dig",10],["👚","Pyjamas på",5],["🪥","Borsta tänderna",3],["🚽","Gå på toa",3],["📖","Saga i sängen",15],["🤗","Godnattkram",0]]
};
function mk(icon,name,kind,list){
  return {id:uid(),icon:icon,name:name,kind:kind,steps:list.map(function(s){return {id:uid(),icon:s[0],name:s[1],min:s[2]||0}})};
}
function defParts(theme){
  if(theme==="dino")return [mk("🌅","Morgon","home",L.morningSmall),mk("🏫","Dagis","away",L.dagis),mk("🏠","Eftermiddag hemma","home",L.home),mk("🌙","Kväll","night",L.eve)];
  return [mk("🌅","Morgon","home",L.morning),mk("🏫","Förskola","away",L.forskola),mk("🎨","Eftis","away",L.eftis),mk("🏠","Eftermiddag hemma","home",L.home),mk("🌙","Kväll","night",L.eve)];
}
function defKid(theme){
  var d=theme==="dino";
  return {id:d?"k2":"k1",name:"",theme:d?"dino":"unicorn",total:0,timers:true,parts:defParts(theme),people:[],
    treat:d?"Vi leker med bilarna tillsammans":"Vi läser en saga tillsammans"};
}
var today=new Date().toDateString(),tISO=iso(),tWD=new Date().getDay();
function freshProg(){return {date:today,idx:-1,start:0,done:{}}}
/* Äldre upplägg (morgon, dagslista, kväll) görs om till delar av dagen */
function upgradeKid(k){
  if(Array.isArray(k.parts))return;
  var parts=[{id:uid(),icon:"🌅",name:"Morgon",kind:"home",steps:Array.isArray(k.steps)?k.steps:[],prog:k.prog}],cur=null;
  (Array.isArray(k.day)?k.day:[]).forEach(function(d){
    var nm=String((d&&d.name)||"");
    if(!cur||/förskola|dagis|skola|eftis|fritids/i.test(nm)){
      var key=nm.toLowerCase(),def=key==="förskola"?L.forskola:key==="eftis"?L.eftis:key==="dagis"?L.dagis:[];
      cur=mk((d&&d.icon)||"🏫",nm,"away",def);parts.push(cur);
    }else if(!cur.steps.some(function(s){return s.name===nm})){
      cur.steps.push({id:uid(),icon:d.icon||"⭐",name:nm,min:0});
    }
  });
  parts.push(mk("🏠","Eftermiddag hemma","home",L.home));
  var ev=mk("🌙","Kväll","night",L.eve);
  if(Array.isArray(k.eve))ev.steps=k.eve;
  ev.prog=k.progE;parts.push(ev);
  k.parts=parts;
  delete k.steps;delete k.day;delete k.eve;delete k.prog;delete k.progE;
}
function normKid(k){
  if(!THEMES[k.theme])k.theme="unicorn";
  if(!k.id)k.id=uid();
  upgradeKid(k);
  if(!Array.isArray(k.people)){
    /* Den hämtare som stod inskriven sedan tidigare blir ett förslag, inte dagens besked */
    k.people=[];
    if(k.pickup){var pr={id:uid(),name:String(k.pickup),photo:""};k.people.push(pr);k.lastPick={who:pr.id,after:String(k.pickupTime||""),time:""}}
  }
  if(typeof k.planOk==="string")delete k.planOk;
  if(k.picked===today&&!(k.pick&&k.pick.date===tISO))k.pick={date:tISO,set:false,who:"",after:"",time:"",done:true};
  delete k.picked;
  k.parts.forEach(function(p){
    if(!p.id)p.id=uid();
    if(!KINDS[p.kind])p.kind="home";
    if(!Array.isArray(p.steps))p.steps=[];
    if(!p.prog||p.prog.date!==today)p.prog=freshProg();
    if(p.kind==="away"){
      normAway(p);
      if(!p.prog.done){p.prog.done={};var ss=stepsOf(p);for(var j=0;j<Math.min(p.prog.idx,ss.length);j++)p.prog.done[ss[j].id]=true}
    }
  });
  return k;
}
function normAway(p){
  if(!p.days||typeof p.days!=="object")p.days={0:{off:true},6:{off:true}};
  if(!p.over||typeof p.over!=="object")p.over={};
  Object.keys(p.over).forEach(function(d){if(d<tISO)delete p.over[d]});
  if(!p.contact)p.contact={name:"",photo:""};
  if(!p.backup)p.backup={name:"",photo:""};
  p.confirmed=!!p.confirmed;
}
function newKid(){var k=defKid("unicorn");k.id=uid();k.pal="🐱";return normKid(k)}

var st=store.get("em.v3",null);
if(!st||!st.fams||!st.fams.length){
  var v2=store.get("em.v2",null), kids, act;
  if(v2&&v2.kids&&v2.kids.length){kids=v2.kids;act=v2.active}
  else{
    var k1=defKid("unicorn"), old=store.get("em.cfg",null);
    if(old){delete k1.parts;delete k1.people;for(var key in old)k1[key]=old[key];k1.total=store.get("em.total",0);var op=store.get("em.prog",null);if(op)k1.prog=op}
    kids=[k1,defKid("dino")];act="k1";
    if(!old)kids.forEach(function(k){k.demo=true});
  }
  st={fam:"f1",fams:[{id:"f1",name:"Vår familj",active:act,kids:kids}]};
}
st.fams.forEach(function(f){f.kids.forEach(normKid)});
store.set("em.v3",st);

var F,cfg,part=null,steps=[],prog=null;
var peek="",unlocked=false,tick=null,openP=-1,openSec="",tplSel={},draft=null,pendSchool=null,msgText="";
var view=$("view"),ov=$("ov");
var save=function(){if(!store.set("em.v3",st))msgText="Det gick inte att spara. Telefonens lagring kan vara full. Ta bort något foto och försök igen."};
function palOf(k){return k.pal||THEMES[k.theme].pal}
function T(){var t=THEMES[cfg.theme];return {pal:palOf(cfg),goal:t.goal,cls:t.cls,label:t.label,party:t.party,hello:t.hello}}
function bodyCls(night,extra){document.body.className=T().cls+(night?" night":"")+(extra?" "+extra:"")}
function pick(id){cfg=F.kids.filter(function(k){return k.id===id})[0]||F.kids[0];F.active=cfg.id;draft=null;pendSchool=null;bodyCls(false)}
function pickFam(id){F=st.fams.filter(function(f){return f.id===id})[0]||st.fams[0];st.fam=F.id;pick(F.active)}
pickFam(st.fam);

/* ---------- Dagens upplägg: grundmall, veckodagsmall eller ändring bara i dag ---------- */
function plan(p){
  var d=p.days&&p.days[tWD],o=p.over&&p.over[tISO],base=d&&d.steps?d.steps:p.steps;
  if(o)return {off:!!o.off,steps:o.steps||base,src:"o"};
  if(d)return {off:!!d.off,steps:base,src:d.steps?"d":"b"};
  return {off:false,steps:p.steps,src:"b"};
}
function stepsOf(p){return p.kind==="away"?plan(p).steps:p.steps}
function offToday(p){return p.kind==="away"&&plan(p).off}
/* Förskola och eftis bockas av aktivitet för aktivitet, i valfri ordning. Hemmarutinerna går steg för steg. */
function isDone(p,s){return !!(p.prog.done&&p.prog.done[s.id])}
function partCount(p){
  var ss=stepsOf(p);
  if(p.kind==="away")return ss.filter(function(x){return isDone(p,x)}).length;
  return p.prog.idx<0?0:Math.min(p.prog.idx,ss.length);
}
function partDone(p){var n=stepsOf(p).length;return !n||partCount(p)>=n}
function setPart(i){part=cfg.parts[i];steps=part.steps;prog=part.prog;bodyCls(part.kind==="night")}
var n=function(){return steps.length};
var doneCount=function(){return prog.idx<0?0:Math.min(prog.idx,n())};
var finished=function(){return n()>0&&prog.idx>=n()};
function rollover(){
  var d=new Date().toDateString();
  if(d===today)return false;
  today=d;tISO=iso();tWD=new Date().getDay();draft=null;
  st.fams.forEach(function(f){f.kids.forEach(function(k){k.parts.forEach(function(p){p.prog=freshProg();if(p.kind==="away")normAway(p)})})});
  store.set("em.v3",st);
  return true;
}

/* ---------- Hämtningen gäller bara det datum den är ifylld för ---------- */
function pk(){return cfg.pick&&cfg.pick.date===tISO?cfg.pick:null}
function picked(){var p=pk();return !!(p&&p.done)}
function person(id){return cfg.people.filter(function(x){return x.id===id})[0]||null}
function setPicked(v){
  var p=pk();
  if(!p)p=cfg.pick={date:tISO,set:false,who:"",after:"",time:"",done:false};
  p.done=v;save();
}
function photoHTML(src,fallback,cls){
  return src?'<img class="ph '+(cls||"")+'" src="'+esc(src)+'" alt="">':'<span class="ph emo '+(cls||"")+'" aria-hidden="true">'+fallback+'</span>';
}
function pickupHTML(now,compact){
  var p=pk(),dn=picked(),who=p&&p.set?person(p.who):null,nm=who&&who.name?esc(who.name):"";
  var h3,lines="";
  if(dn)h3=nm?nm+" har hämtat dig":"Du är hämtad";
  else if(nm){
    h3=nm+" hämtar dig";
    if(compact){if(p.after||p.time)lines+='<p>'+esc([p.after,p.time?"klockan "+p.time:""].filter(Boolean).join(", "))+'</p>'}
    else{
      if(p.after)lines+='<p>'+esc(p.after)+'</p>';
      if(p.time)lines+='<p>Klockan '+esc(p.time)+'</p>';
    }
  }else{h3="Hämtning i dag";lines='<p>En vuxen fyller i vem som hämtar.</p>'}
  if(cfg.treat&&!compact)lines+='<p>Sedan hemma: '+esc(cfg.treat)+'</p>';
  return '<div class="part hug '+(dn?"done":now?"now":"")+(compact?" compact":"")+'">'+photoHTML(who&&who.photo,dn?"✅":"🤗","lg")+
    '<div class="hugtx"><small class="lbl">Hämtning'+(dn?" · klar":"")+'</small><h3>'+h3+'</h3>'+lines+
    '</div>'+(dn?'<button class="sm" data-pick="0">↩ Ångra</button>':'<button class="sm strong" data-pick="1">Nu är jag hämtad</button>')+'</div>';
}
function bindPickup(again){
  Array.prototype.forEach.call(view.querySelectorAll("[data-pick]"),function(b){
    b.onclick=function(){setPicked(b.dataset.pick==="1");again()};
  });
}

/* ---------- Dagens stopp i ordning ---------- */
function items(){
  var ps=cfg.parts.map(function(p,i){return {i:i,p:p}}).filter(function(x){return !offToday(x.p)}),out=[],lastAway=-1;
  ps.forEach(function(x,k){if(x.p.kind==="away")lastAway=k});
  ps.forEach(function(x,k){out.push(x);if(k===lastAway)out.push({pickup:true})});
  return out;
}
function itemDone(x){return x.pickup?picked():partDone(x.p)}
function itemStarted(x){return x.pickup?picked():x.p.kind==="away"?partCount(x.p)>0:x.p.prog.idx>=0&&stepsOf(x.p).length>0}
/* Figuren står vid det som pågår. Tidigare delar behöver inte vara avbockade. */
function curItem(it){
  it=it||items();
  var last=-1;
  it.forEach(function(x,k){if(itemStarted(x))last=k});
  if(last>=0&&!itemDone(it[last]))return it[last];
  for(var k=last+1;k<it.length;k++)if(!itemDone(it[k]))return it[k];
  return null;
}

/* ---------- Skoldagen: ett bildschema som bockas av tillsammans ---------- */
function school(){
  var ps=cfg.parts.filter(function(p){return p.kind==="away"}),on=ps.filter(function(p){return !offToday(p)}),acts=[];
  on.forEach(function(p){stepsOf(p).forEach(function(s,i){acts.push({p:p,i:i,s:s})})});
  var order=acts.map(function(a){return {a:a,done:isDone(a.p,a.s)}});
  if(on.length)order.push({pickup:true,done:picked()});
  var next=-1;
  for(var k=0;k<order.length;k++)if(!order[k].done){next=k;break}
  return {all:ps,on:on,off:ps.filter(offToday),acts:acts,order:order,next:next,count:acts.filter(function(a){return isDone(a.p,a.s)}).length};
}
/* Fingeravtryck av det barnet får se i dag. Ändras något efter kontrollen stämmer det inte längre. */
function planSig(sc){
  var p=pk(),who=p&&p.set?person(p.who):null,c;
  var t=JSON.stringify([tISO,sc.on.map(function(x){c=contactOf(x);return [x.name,x.icon,c?c.name:"",stepsOf(x).map(function(s){return [s.icon,s.name,s.time||""]})]}),
    sc.off.map(function(x){return x.name}),who?[who.name,p.after,p.time]:null]);
  var h=5381;for(var i=0;i<t.length;i++)h=((h<<5)+h+t.charCodeAt(i))|0;
  return String(h);
}
/* Det som måste vara klart innan dagsplanen visas för barnet */
function schoolIssues(sc){
  var out=[],p=pk(),who=p&&p.set?person(p.who):null;
  if(!sc.on.length)return out;
  sc.on.forEach(function(x){if(!x.confirmed)out.push({t:"routine",p:x})});
  if(!(who&&who.name))out.push({t:"pick"});
  var ok=cfg.planOk&&cfg.planOk.date===tISO;
  if(!ok)out.push({t:"day"});
  else if(cfg.planOk.sig!==planSig(sc))out.push({t:"changed"});
  return out;
}
function issueText(x){
  if(x.t==="routine")return '<b>'+esc(x.p.name)+':</b> rutinen är inte bekräftad. Aktiviteterna är fortfarande exempel.';
  if(x.t==="pick")return '<b>Hämtning:</b> dagens hämtare är inte angiven.';
  if(x.t==="changed")return '<b>Ändrat efter kontrollen:</b> hämtningen eller dagens upplägg har ändrats och behöver bekräftas igen.';
  return '<b>Dagens kontroll:</b> ingen vuxen har bekräftat dagens plan och hämtning i dag.';
}
function renderCheck(sc,issues){
  view.innerHTML='<div class="adult" style="display:flex;flex-direction:column;gap:12px"><h2>För vuxna: innan dagsplanen visas</h2>'+
    '<p>Det här behöver bli klart för '+WDL[tWD]+' '+fmtDate(tISO)+(cfg.name?" för "+esc(cfg.name):"")+'. Dagsplanen visas först när allt stämmer.</p>'+
    '<ul class="todo">'+issues.map(function(x){return '<li class="warnbox">⚠ '+issueText(x)+'</li>'}).join("")+'</ul>'+
    '<a class="big" style="text-align:center;text-decoration:none;display:block" href="#for-vuxna">Fyll i och bekräfta</a>'+
    '<p>Bakom knappen frågar appen efter talet fyrtiotvå. Hjälpkorten går alltid att öppna.</p>'+
    '<a class="sm strong" href="#hjalp">🙋 Öppna hjälpkorten</a>'+
    '<button class="sm" id="peek">Visa dagsplanen ändå, obekräftad</button>'+
    '<p>Den obekräftade planen visas med en varningsrad överst tills allt är bekräftat.</p></div>';
  $("peek").onclick=function(){peek=cfg.id+tISO;renderSchool()};
}
function contactOf(p){return p.backupOn===tISO&&p.backup&&p.backup.name?p.backup:p.contact}
function contactHTML(p){
  var c=contactOf(p);
  if(!c||!c.name)return "";
  return '<div class="adultrow">'+photoHTML(c.photo,"🙂")+'<span>Din vuxen här: <b>'+esc(c.name)+'</b></span></div>';
}
function rowHTML2(o,k,isNext){
  var cls=o.done?"done":isNext?"next":"",ic,b,sm="",lab;
  if(o.pickup){
    var p=pk(),who=p&&p.set?person(p.who):null,nm=who&&who.name?esc(who.name):"";
    ic=photoHTML(who&&who.photo,"🤗");
    b=o.done?(nm?nm+" har hämtat dig":"Du är hämtad"):(nm?nm+" hämtar dig":"Hämtning");
    sm=nm?esc([p.after,p.time?"klockan "+p.time:""].filter(Boolean).join(", ")):"En vuxen fyller i vem som hämtar.";
    lab="Hämtning";cls+=" pickup";
  }else{
    ic='<span class="ic">'+esc(o.a.s.icon)+'</span>';b=esc(o.a.s.name);sm=o.a.s.time?"Klockan "+esc(o.a.s.time):"";lab=o.a.s.name;
  }
  return '<label class="chk-row '+cls+'"><input type="checkbox" class="bigbox" data-k="'+k+'" '+(o.done?"checked":"")+' aria-label="'+esc(lab)+(o.done?", gjort":"")+'">'+
    ic+'<span class="tx"><b>'+b+'</b>'+(sm?'<small>'+sm+'</small>':'')+'</span>'+(isNext?'<small class="tag">Nästa</small>':'')+'</label>';
}
function renderSchool(){
  clearInterval(tick);bodyCls(false,"school");
  var sc=school(),h="",issues=schoolIssues(sc);
  if(issues.length&&peek!==cfg.id+tISO){renderCheck(sc,issues);return}
  if(issues.length)h+='<a class="peekbar" href="#for-vuxna">⚠ Inte bekräftad. Kan innehålla exempel. <b>Bekräfta</b></a>';
  if(!sc.all.length){
    h+='<div class="bubble">Det finns ingen förskola eller eftis inlagd. En vuxen kan lägga till det under kugghjulet.</div>';
  }else if(!sc.on.length){
    h+='<div class="nowcard"><small class="lbl">I dag</small><div class="pic">🏠</div><h2>Ingen '+esc(sc.all[0].name.toLowerCase())+' i dag</h2></div>';
  }else{
    var total=sc.acts.length,lastP=null;
    h+='<div class="mini" role="img" aria-label="'+sc.count+' av '+total+' aktiviteter är avbockade"><div class="bar"></div>'+
       '<span class="mpal" style="left:'+(total?sc.count/total*100:0)+'%"><span>'+esc(T().pal)+'</span></span><span class="mgoal">🤗</span></div><div class="sched">';
    sc.order.forEach(function(o,k){
      if(o.pickup){
        sc.off.forEach(function(p){h+='<div class="chipline plain"><span>'+esc(p.icon)+'</span> Ingen '+esc(p.name.toLowerCase())+' i dag</div>'});
      }else if(o.a.p!==lastP){
        lastP=o.a.p;
        h+='<div class="phead"><b>'+esc(lastP.icon)+' '+esc(lastP.name)+'</b>'+contactHTML(lastP)+'</div>';
      }
      h+=rowHTML2(o,k,k===sc.next);
    });
    h+='</div>';
  }
  view.innerHTML=h;
  Array.prototype.forEach.call(view.querySelectorAll(".bigbox"),function(box){

function listOf(a){

    min:Math.max(0,Math.min(60,parseInt(x.min,10)||0)),time:str(x.time,12)}}):null;
}
function cleanPart(p){
  p=p||{};
  var c={id:uid(),icon:str(p.icon||"⭐",8),name:str(p.name,40),kind:p.kind,steps:listOf(p.steps)||[]};
  if(p.kind==="away"){
    c.confirmed=!!p.confirmed;c.contact=cleanPerson(p.contact);c.backup=cleanPerson(p.backup);c.backupOn=str(p.backupOn,10);
    if(p.days&&typeof p.days==="object"){c.days={};for(var d=0;d<7;d++){var x=p.days[d];if(x){c.days[d]={off:!!x.off};var ls=listOf(x.steps);if(ls)c.days[d].steps=ls}}}
    c.over={};
    if(p.over&&p.over[tISO]){var o=p.over[tISO];c.over[tISO]={off:!!o.off};var os=listOf(o.steps);if(os)c.over[tISO].steps=os}
  }

}
function cleanKid(k){

    treat:str(k.treat,60),helpNote:str(k.helpNote,600)};

  else if(k.pickup){c.pickup=str(k.pickup,30);c.pickupTime=str(k.pickupTime,30)}
  if(Array.isArray(k.parts))c.parts=k.parts.slice(0,10).map(cleanPart);

function cleanFam(o){

function carry(p,q){
  if(!q||!q.prog)return;

  stepsOf(q).forEach(function(s){if(isDone(q,s)){var m=stepsOf(p).filter(function(x){return x.name===s.name})[0];if(m)d[m.id]=true}});
  p.prog={date:q.prog.date,idx:q.prog.idx,start:q.prog.start,done:d};
}

function parseShared(txt){

function applySchool(s,targetId){
  var k=F.kids.filter(function(x){return x.id===targetId})[0];
  if(!k){
    /* Tomma exempelbarn på en ny telefon tas bort när en riktig plan läses in */
    F.kids=F.kids.filter(function(x){return !x.demo});
    k=normKid({id:uid(),name:s.name,pal:s.pal,theme:s.theme,total:0,timers:true,treat:"",people:[],parts:[]});
    F.kids.push(k);
  }
  var olds=k.parts.filter(function(p){return p.kind==="away"}),at=olds.length?k.parts.indexOf(olds[0]):Math.min(1,k.parts.length);
  s.parts.forEach(function(p){carry(p,olds.filter(function(x){return x.name===p.name})[0])});
  var rest=k.parts.filter(function(p){return p.kind!=="away"});
  var before=k.parts.slice(0,at).filter(function(p){return p.kind!=="away"}).length;
  k.parts=rest.slice(0,before).concat(s.parts,rest.slice(before));
  k.helpNote=s.helpNote;
  if(s.pick&&s.date===tISO){
    var pr=k.people.filter(function(x){return x.name===s.pick.who.name})[0];
    if(!pr){pr={id:uid(),name:s.pick.who.name,photo:s.pick.who.photo};k.people.push(pr)}else if(s.pick.who.photo)pr.photo=s.pick.who.photo;
    k.pick={date:tISO,set:true,who:pr.id,after:s.pick.after,time:s.pick.time,done:!!(k.pick&&k.pick.date===tISO&&k.pick.done)};
  }
  k.planImported={at:Date.now(),made:s.made,date:s.date};k.planOk=null;k.demo=false;
  pick(k.id);save();
}
function shareText(text,fileName,msg){

}

function skyHTML(){
  var cols=["var(--r1)","var(--r2)","var(--r3)","var(--r4)","var(--r5)","var(--r6)"],arcs="";
  for(var i=0;i<6;i++){var r=132-i*11;arcs+='<path d="M'+(160-r)+' 150 A'+r+' '+r+' 0 0 1 '+(160+r)+' 150" fill="none" stroke="'+cols[i]+'" stroke-width="11"/>'}
  if(cfg.theme==="dino"){
    arcs='<path d="M56 150 A104 104 0 0 1 264 150" fill="none" stroke="#8B93A1" stroke-width="46"/>'+
         '<path d="M56 150 A104 104 0 0 1 264 150" fill="none" stroke="#fff" stroke-width="4" stroke-dasharray="12 12"/>';
  }
  var bush=cfg.theme==="dino"?"#A6D9A2":"#fff", goal=T().goal;
  if(part.kind==="night"){
    arcs='<path d="M56 150 A104 104 0 0 1 264 150" fill="none" stroke="#C9C3F5" stroke-opacity=".55" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 13"/>';
    [[40,40],[95,22],[150,52],[205,18],[262,44],[300,90],[20,96],[160,110]].forEach(function(q,k){
      arcs+='<circle cx="'+q[0]+'" cy="'+q[1]+'" r="'+(k%3?1.6:2.4)+'" fill="#FFE9A8"/>'});
    bush="#3A3B7C";goal="🌙";
  }
  var p=n()?doneCount()/n():0, th=Math.PI*(1-p), R=104;
  var x=(160+R*Math.cos(th))/320*100, y=(150-R*Math.sin(th))/160*100-6;
  var s="";for(var j=0;j<n();j++)s+='<i class="'+(j<doneCount()?"on":"")+'">⭐</i>';
  return '<div class="sky" role="img" aria-label="'+doneCount()+' av '+n()+' steg klara">'+
    '<svg viewBox="0 0 320 160" aria-hidden="true">'+arcs+
    '<ellipse cx="34" cy="150" rx="34" ry="13" fill="'+bush+'"/><ellipse cx="286" cy="150" rx="34" ry="13" fill="'+bush+'"/></svg>'+
    '<div class="goal" style="left:'+(264/320*100)+'%;top:82%">'+(finished()?"":goal)+'</div>'+
    '<div class="pal" style="left:'+x+'%;top:'+y+'%"><span>'+esc(T().pal)+'</span></div>'+
    '<div class="stars">'+s+'</div></div>';
}
function stripHTML(){
  return '<div class="strip" aria-label="Alla steg">'+steps.map(function(s,i){
    var c=i<doneCount()?"done":(i===prog.idx?"now":"");

  };

function updateTimer(){
  var arc=$("arc"),t=$("time"),s=steps[prog.idx];
  if(!arc||!s){clearInterval(tick);return}
  var C=2*Math.PI*52;
  if(!cfg.timers||!(s.min>0)){arc.style.strokeDashoffset=0;t.textContent="";return}
  var tot=s.min*60, rem=tot-(Date.now()-prog.start)/1000;
  if(rem<=0){
    arc.style.strokeDashoffset=C;t.textContent="";
    $("say").textContent="Ingen brådska. Tryck när du är klar.";
  }else{
    arc.style.strokeDashoffset=C*(1-rem/tot);
    t.textContent=rem>=60?Math.ceil(rem/60)+" min kvar":"Snart klar";
  }
}

function choosePhoto(done){
  var inp=document.createElement("input");inp.type="file";inp.accept="image/*";
  inp.onchange=function(){
    var f=inp.files&&inp.files[0];if(!f)return;
    var rd=new FileReader();
    rd.onload=function(){
      var im=new Image();
      im.onload=function(){
        var S=160,c=document.createElement("canvas");c.width=c.height=S;
        var m=Math.min(im.width,im.height);
        c.getContext("2d").drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,S,S);
        done(c.toDataURL("image/jpeg",0.72));
      };
      im.src=rd.result;
    };
    rd.readAsDataURL(f);
  };
  inp.click();
}
function loadText(txt){
  var r;
  try{r=parseShared(txt)}catch(err){$("codemsg").textContent="Det gick inte att läsa. Kopiera hela meddelandet eller välj hela filen och försök igen.";return}
  if(r.school){pendSchool=r.school;openSec="share";renderAdult()}
  else{addFam(r.fam);openP=-1;renderWho();renderAdult()}
}
/* Minns vilken ruta som är öppen, så att den förblir öppen när sidan ritas om */
view.addEventListener("click",function(e){
  var sm=e.target.closest("summary"),d=sm&&sm.parentNode;if(!d||!d.classList)return;
  if(d.classList.contains("pt"))openP=d.open?-1:+d.dataset.p;
  if(d.classList.contains("sec"))openSec=d.open?"":d.dataset.sec;
});
view.addEventListener("input",function(e){
  var t=e.target;if(!unlocked||!t.closest(".adult"))return;
  var row=t.closest(".row[data-list]"),again=false,pi;
  if(row){
    var it=listBy(row.dataset.list)[+row.dataset.i],f=t.dataset.f;
    it[f]=f==="min"?Math.max(0,Math.min(60,parseInt(t.value,10)||0)):t.value;touch();
  }else if(t.dataset.pf){
    pi=+t.dataset.p;cfg.parts[pi][t.dataset.pf]=t.value;touch();
    if(t.dataset.pf==="kind"){if(t.value==="away")normAway(cfg.parts[pi]);clampProgs();again=true}
  }else if(t.dataset.cf){cfg.parts[+t.dataset.p][t.dataset.cf].name=t.value;touch()}
  else if(t.dataset.tpl){tplSel[cfg.parts[+t.dataset.tpl].id]=t.value;again=true}
  else if(t.dataset.bk){cfg.parts[+t.dataset.bk].backupOn=t.checked?tISO:"";touch()}
  else if(t.id==="pk-after"||t.id==="pk-time"){var d=getDraft();d[t.id==="pk-after"?"after":"time"]=t.value;if(!d.dirty){d.dirty=true;again=false}}
  else if(t.id==="per-name"){var pr=person(getDraft().who);if(pr){pr.name=t.value;touch()}}
  else if(t.id==="helpnote"){cfg.helpNote=t.value;touch()}
  else if(t.id==="treat"){cfg.treat=t.value}
  else if(t.id==="timers"){cfg.timers=t.checked}
  else if(t.id==="kidname"){cfg.name=t.value;cfg.demo=false;renderWho()}
  else if(t.id==="kidpal"){cfg.pal=t.value.trim();cfg.demo=false;renderWho()}
  else if(t.name==="theme"){cfg.theme=t.value;cfg.demo=false;bodyCls(false,"grown");renderWho()}
  else if(t.id==="famname"){F.name=t.value}
  else if(t.id==="famsel"){pickFam(t.value);openP=-1;save();renderWho();renderAdult();return}
  else return;
  save();if(again)renderAdult();
});
view.addEventListener("click",function(e){
  var t=e.target.closest("[data-act]");if(!t||!unlocked||!t.closest(".adult"))return;
  var a=t.dataset.act,pi=t.dataset.p!==undefined?+t.dataset.p:-1,p=pi>=0?cfg.parts[pi]:null,ps=cfg.parts,d=getDraft(),row=t.closest(".row[data-list]"),wd=+t.dataset.wd;
  if(row&&(a==="up"||a==="down"||a==="del")){
    var arr=listBy(row.dataset.list),i=+row.dataset.i;
    if(a==="del")arr.splice(i,1);
    if(a==="up"&&i>0)arr.splice(i-1,0,arr.splice(i,1)[0]);
    if(a==="down"&&i<arr.length-1)arr.splice(i+1,0,arr.splice(i,1)[0]);
    clampProgs();touch();
  }
  else if(a==="addstep"){var key=t.dataset.list,aw=cfg.parts[+key.split(":")[0]].kind==="away";listBy(key).push({id:uid(),icon:"⭐",name:aw?"Ny aktivitet":"Nytt steg",min:aw?0:5,time:""});touch()}
  else if(a==="confirm"){p.confirmed=true;touch();save();renderWho();renderAdult();window.scrollTo(0,0);return}
  else if(a==="wd"){var dd=p.days[wd]||(p.days[wd]={});dd.off=!dd.off;if(!dd.off&&!dd.steps)delete p.days[wd];clampProgs();touch()}
  else if(a==="mkday"){(p.days[wd]||(p.days[wd]={})).steps=copySteps(p.steps);clampProgs();touch()}
  else if(a==="rmday"){if(!sure(t))return;delete p.days[wd].steps;if(!p.days[wd].off)delete p.days[wd];clampProgs();touch()}
  else if(a==="offtoday"){p.over[tISO]={off:true};touch()}
  else if(a==="ontoday"){
    var o=p.over[tISO];
    if(o&&o.off){delete p.over[tISO]}
    if(plan(p).off)p.over[tISO]={off:false};   /* veckodagen är normalt ledig, men just i dag gäller den */
    clampProgs();touch();
  }
  else if(a==="mkover"){p.over[tISO]={off:false,steps:copySteps(plan(p).steps)};touch()}
  else if(a==="rmover"){if(!sure(t,"Tryck igen för att ta bort dagens ändring"))return;delete p.over[tISO];clampProgs();touch()}
  else if(a==="planok"){cfg.planOk={date:tISO,sig:planSig(school()),at:Date.now()}}
  else if(a==="peek"){peek=cfg.id+tISO;location.hash="#skola";return}
  else if(a==="openpart"){
    openSec="parts";openP=pi;save();renderAdult();
    var el=view.querySelector('details.pt[data-p="'+pi+'"]');if(el&&el.scrollIntoView)el.scrollIntoView();
    return;
  }
  else if(a==="who"){d.who=t.dataset.id;d.dirty=true}
  else if(a==="addperson"){var np={id:uid(),name:"",photo:""};cfg.people.push(np);d.who=np.id;d.dirty=true}
  else if(a==="delperson"){if(!sure(t))return;cfg.people=cfg.people.filter(function(x){return x.id!==d.who});d.who="";d.dirty=true;if(cfg.pick&&!person(cfg.pick.who))cfg.pick.set=false}
  else if(a==="setpick"){
    var was=pk(),pp=person(d.who);
    if(!pp||!pp.name.trim()){msgText="Välj eller skriv in vem som hämtar innan du bekräftar.";renderAdult();window.scrollTo(0,0);return}
    cfg.pick={date:tISO,set:true,who:d.who,after:d.after.trim(),time:d.time.trim(),done:!!(was&&was.done)};
    cfg.lastPick={who:d.who,after:cfg.pick.after,time:cfg.pick.time};draft=null;touch();
  }
  else if(a==="clearpick"){if(cfg.pick)cfg.pick.set=false;draft=null;touch()}
  else if(a==="photo"){choosePhoto(function(url){var o=photoTarget(t);if(o){o.photo=url;touch();save();renderAdult()}});return}
  else if(a==="nophoto"){var o2=photoTarget(t);if(o2)o2.photo="";touch()}
  else if(a==="addpart"){ps.push({id:uid(),icon:"⭐",name:"Ny del",kind:"home",steps:[],prog:freshProg()});openP=ps.length-1}
  else if(a==="pup"&&pi>0){ps.splice(pi-1,0,ps.splice(pi,1)[0]);openP=pi-1;touch()}
  else if(a==="pdown"&&pi<ps.length-1){ps.splice(pi+1,0,ps.splice(pi,1)[0]);openP=pi+1;touch()}
  else if(a==="pdel"){if(!sure(t))return;ps.splice(pi,1);openP=-1;touch()}
  else if(a==="redo"){
    if(!sure(t,"Tryck igen för att börja om dagen"))return;
    ps.forEach(function(x){if(x.kind!=="away")cfg.total=Math.max(0,(cfg.total||0)-partCount(x));x.prog=freshProg()});
    if(cfg.pick)cfg.pick.done=false;save();location.hash="#dagen";return;
  }
  else if(a==="zero"){cfg.total=0}
  else if(a==="addfam"){var nf={id:uid(),name:"Ny familj",kids:[newKid()]};nf.active=nf.kids[0].id;st.fams.push(nf);pickFam(nf.id);openP=-1}
  else if(a==="addkid"){var nk=newKid();F.kids.push(nk);pick(nk.id);openP=-1}
  else if(a==="delfam"||a==="delkid"){
    if(!sure(t))return;
    if(a==="delfam"){st.fams.splice(st.fams.indexOf(F),1);pickFam(st.fams[0].id)}
    else{F.kids.splice(F.kids.indexOf(cfg),1);pick(F.kids[0].id)}
    openP=-1;
  }
  else if(a==="shareschool"){cfg.planShared=Date.now();save();openSec="share";shareText(exportSchool(),"rutiner-skoldag-"+tISO+".txt",$("codemsg"));return}
  else if(a==="sharefam"){openSec="share";renderAdult();shareText(exportFam(),"rutiner-familj.txt",$("codemsg"));return}
  else if(a==="load"){loadText($("code").value);return}
  else if(a==="loadfile"){
    var inp=document.createElement("input");inp.type="file";inp.accept=".txt,.json,text/plain,application/json";
    inp.onchange=function(){var f=inp.files&&inp.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){loadText(rd.result)};rd.readAsText(f)};
    inp.click();return;
  }
  else if(a==="applyschool"){var s=pendSchool,target=$("imp-target").value;pendSchool=null;applySchool(s,target);pendSchool=null;msgText="Planen är inläst. Kontrollera dagens plan och hämtning här ovanför.";openSec=""}
  else if(a==="cancelschool"){pendSchool=null}
  else return;
  save();renderWho();renderAdult();
});

/* ---------- Stjärnregn, bara i hemmarutinerna ---------- */
function party(count){
  if(window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  var c=$("fx"),x=c.getContext("2d"),W=c.width=innerWidth,H=c.height=innerHeight;
  var em=T().party,ps=[];
  for(var i=0;i<count;i++)ps.push({x:Math.random()*W,y:-20-Math.random()*H*.4,v:2+Math.random()*4,s:18+Math.random()*22,e:em[i%4],w:Math.random()*6});
  var t0=performance.now();
  (function f(t){
    x.clearRect(0,0,W,H);
    ps.forEach(function(p){p.y+=p.v;p.x+=Math.sin((t+p.w*300)/300);x.font=p.s+"px serif";x.fillText(p.e,p.x,p.y)});
    if(t-t0<3200)requestAnimationFrame(f);else x.clearRect(0,0,W,H);
  })(t0);
}

/* ---------- Sidor ---------- */
function route(){
  rollover();closeOv();
  var h=location.hash.slice(1),m=/^del-(\d+)$/.exec(h),pi=-1,tab;
  if(!h)h=st.tab==="skola"||!cfg.parts.some(function(p){return p.kind!=="away"})?"skola":"dagen";
  if(h==="nu"){var c=curItem();h=!c?"dagen":(c.pickup||c.p.kind==="away")?"skola":"del-"+(c.i+1);m=/^del-(\d+)$/.exec(h)}
  if(m&&cfg.parts[+m[1]-1]){pi=+m[1]-1;if(cfg.parts[pi].kind==="away"){pi=-1;h="skola"}}
  tab=h==="for-vuxna"||h==="utskrift"?"for-vuxna":h==="skola"?"skola":h==="hjalp"?"hjalp":pi>=0?"":"dagen";
  if(tab!=="for-vuxna")unlocked=false;
  if((tab==="skola"||tab==="dagen")&&st.tab!==tab){st.tab=tab;save()}
  renderWho();
  Array.prototype.forEach.call(document.querySelectorAll("nav a"),function(a){
    if(a.dataset.tab===tab)a.setAttribute("aria-current","page");else a.removeAttribute("aria-current");
  });
  if(h==="utskrift")renderPrint();
  else if(tab==="for-vuxna")renderAdult();
  else if(tab==="skola")renderSchool();
  else if(tab==="hjalp")renderHelp();
  else if(pi>=0)renderPart(pi);
  else renderRoad();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
/* Ligger appen öppen över midnatt börjar dagen om av sig själv */
document.addEventListener("visibilitychange",function(){if(!document.hidden&&rollover())route()});
setInterval(function(){if(rollover())route()},60000);
route();
})();
